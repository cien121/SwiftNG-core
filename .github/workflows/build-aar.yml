name: Build SwiftNG Core AAR

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout bindings
        uses: actions/checkout@v4
        with:
          path: core-bindings

      - name: Checkout xray-core (SwiftNG fork, AnyTLS patched)
        uses: actions/checkout@v4
        with:
          repository: cien121/xray-core
          ref: main
          path: xray-core

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Install Android NDK r27
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          "$(go env GOPATH)/bin/gomobile" init
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Fetch geo assets
        working-directory: core-bindings
        run: |
          curl -sSL https://github.com/Chocolate4U/Iran-v2ray-rules/releases/latest/download/geoip.dat -o assets/geoip.dat
          curl -sSL https://github.com/Chocolate4U/Iran-v2ray-rules/releases/latest/download/geosite.dat -o assets/geosite.dat
          ls -lh assets/

      - name: Build AAR with gomobile
        working-directory: core-bindings
        run: |
          gomobile bind -androidapi 24 -trimpath \
            -ldflags='-s -w -buildid= -checklinkname=0' \
            -o swiftng-core.aar ./
          ls -lh swiftng-core.aar

      - name: Verify AnyTLS patch is compiled in
        working-directory: core-bindings
        run: |
          rm -rf /tmp/aarx && mkdir -p /tmp/aarx
          unzip -q swiftng-core.aar -d /tmp/aarx
          if strings /tmp/aarx/jni/arm64-v8a/libgojni.so | grep -qm1 'proxy/anytls'; then
            echo "OK: AnyTLS code found in libgojni.so"
          else
            echo "FAIL: AnyTLS code NOT found in libgojni.so"
            exit 1
          fi

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: swiftng-core-aar
          path: core-bindings/swiftng-core.aar
          retention-days: 14
